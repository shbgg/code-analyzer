[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "code_analyzer"
version = "0.1.0"
description = "An automated code analysis tool powered by LangGraph workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain-community>=0.4.0",
    "langchain-google-genai>=4.2.0",
    "langchain>=1.3.0",
    "langgraph>=1.2.0",
    "rich>=14.0.0",
    "ipython>=9.10.0",
    "platformdirs>=4.10.0"
]

[project.scripts]
code-analyzer = "code_analyzer.cli:main"

[tool.setuptools.package-dir]
"code_analyzer" = "src"